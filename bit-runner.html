<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>デジタル進化ラン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: 1画面ゲーム。上にHUD、中央に16:9のゲーム画面、下にタッチ操作。夜のゲームセンター風の単一トーンで固定 */
:root{
  --bg:#0B1219; --panel:#141F2A; --ink:#E6EDF2; --muted:#8FA2B3; --line:#263646;
  --gold:#F5B83A; --blue:#5AA6F0; --pink:#F06A90; --ok:#4CC38A;
  --dot:'DotGothic16','Zen Kaku Gothic New',monospace;
  --display:'Dela Gothic One','Zen Kaku Gothic New',sans-serif;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Meiryo',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;max-width:1200px;margin:0 auto}
.hud{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-family:var(--dot);font-size:15px}
.hud .t{font-family:var(--display);font-size:18px;color:var(--gold);margin-right:auto}
.hud b{color:var(--gold);font-weight:400}
.hud .era{color:var(--blue)}
.hud a{color:var(--muted);font-family:var(--body);font-size:13px}
.stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.screen{position:relative;width:100%;max-height:100%;aspect-ratio:16/9;max-width:calc((100vh - 150px) * 16 / 9)}
#cv{display:block;width:100%;height:100%;border-radius:8px;background:#000;image-rendering:pixelated}
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,14,20,.88);border-radius:8px;padding:16px;overflow:auto}
.ov[hidden]{display:none}
.card{max-width:640px;width:100%;display:grid;gap:12px;text-align:center}
.card .k{font-family:var(--dot);color:var(--blue);letter-spacing:.15em;font-size:14px}
.card h1,.card h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
.card h1{font-size:clamp(30px,6vw,56px)} .card h1 span{color:var(--gold)}
.card h2{font-size:clamp(24px,4vw,38px);color:var(--gold)}
.card p{margin:0;color:var(--muted);line-height:1.7}
.spec{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-family:var(--dot)}
.spec div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
.spec small{display:block;color:var(--muted);font-size:12px}
.spec b{font-weight:400;font-size:18px;color:var(--ink)}
.calc{font-family:var(--dot);background:var(--panel);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.6}
.calc b{color:var(--gold);font-weight:400;font-size:20px}
.big{font-family:var(--display);font-size:22px;background:var(--gold);color:#0B1219;border:0;border-radius:999px;padding:10px 40px;justify-self:center}
.big:hover{background:#FFD06A}
.sub{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 14px;color:var(--muted);justify-self:center}
.sub:hover{border-color:var(--blue);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.keys{font-size:13px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-family:var(--dot);font-size:14px}
th,td{border:1px solid var(--line);padding:4px 6px}
th{color:var(--muted);font-weight:400}
td.n{color:var(--gold)}
.tbl{overflow-x:auto}
.qz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qopt{font-family:var(--dot);font-size:18px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 8px}
.qopt:hover{border-color:var(--gold)}
.qopt.ok{border-color:var(--ok);color:var(--ok)} .qopt.ng{border-color:var(--pink);color:var(--pink)}
.ed{display:flex;gap:16px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
#edc{width:256px;height:256px;max-width:100%;border-radius:6px;cursor:crosshair;touch-action:none;image-rendering:pixelated;background:#fff}
.pal{display:grid;grid-template-columns:repeat(4,36px);gap:6px;align-content:start}
.pal button{width:36px;height:36px;border-radius:8px;border:2px solid var(--line);padding:0}
.pal button.on{outline:3px solid var(--gold);outline-offset:2px}
.pal button.clear{background:repeating-conic-gradient(#cfd6dd 0 25%,#fff 0 50%) 0 0/12px 12px}
.palinfo{grid-column:1/-1;font-family:var(--dot);font-size:13px;color:var(--muted);text-align:left;line-height:1.5}
.palinfo b{color:var(--gold);font-weight:400}
.charnow{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.charnow canvas{width:32px;height:32px;image-rendering:pixelated;background:#fff;border-radius:4px}
.touch{display:none;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none}
.touch div{display:flex;gap:10px}
.touch button{width:72px;height:56px;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-size:22px;touch-action:none}
.touch button.j{width:110px;background:var(--gold);color:#0B1219;border-color:var(--gold);font-family:var(--display);font-size:18px}
@media (pointer:coarse){.touch{display:flex}}
@media (max-width:640px){.spec{grid-template-columns:repeat(2,minmax(0,1fr))}.qz{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span class="t">デジタル進化ラン</span>
    <span>STAGE <b id="hStage">1</b>/5</span>
    <span class="era" id="hEra">2色</span>
    <span>なめらかさ <b id="hFps">10</b>fps</span>
    <span>コイン <b id="hCoin">0</b></span>
    <span>ライフ <b id="hLife">3</b></span>
    <span>のこり <b id="hTime">0</b>秒</span>
    <a href="#" id="back">もどる</a>
  </div>
  <div class="stage">
    <div class="screen">
      <canvas id="cv" width="960" height="540" aria-label="ゲーム画面"></canvas>
      <div class="ov" id="ov"><div class="card" id="card"></div></div>
    </div>
  </div>
  <div class="touch" id="touch">
    <div><button data-k="L" aria-label="左へ">◀</button><button data-k="R" aria-label="右へ">▶</button></div>
    <div><button class="j" data-k="J">ジャンプ</button></div>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cv=$('#cv'),out=cv.getContext('2d');
const VW=256,VH=144,T=16;

/* ===== 時代（ステージ）の設定 ===== */
const ERAS=[
  {name:'1ビットの時代',col:'2色',bits:1,w:128,h:72,fps:10,time:200,len:110,gap:[1,2],gapP:.22,en:.25,es:.45,fly:0,steps:false,gates:1,gmax:15,
   note:'白と黒の2色だけ。1つの点（画素）を1ビットで表します。動きも1秒に10コマでカクカク。'},
  {name:'2ビットの時代',col:'4色',bits:2,w:160,h:90,fps:15,time:180,len:130,gap:[1,3],gapP:.3,en:.35,es:.55,fly:0,steps:false,gates:1,gmax:31,
   note:'4段階の明るさ。2ビットで4通りの色を表せます。'},
  {name:'4ビットの時代',col:'16色',bits:4,w:256,h:144,fps:20,time:170,len:150,gap:[2,3],gapP:.36,en:.45,es:.7,fly:0,steps:true,gates:1,gmax:63,
   note:'16色が使えるようになり、点も細かくなりました。'},
  {name:'8ビットカラーの時代',col:'256色',bits:8,w:480,h:270,fps:30,time:160,len:170,gap:[2,4],gapP:.42,en:.55,es:.85,fly:4,steps:true,gates:2,gmax:127,
   note:'256色。グラデーションも表せるようになり、動きもなめらかになってきます。'},
  {name:'フルカラーの時代',col:'約1,677万色',bits:24,w:960,h:540,fps:60,time:150,len:190,gap:[2,4],gapP:.48,en:.65,es:1.05,fly:8,steps:true,gates:2,gmax:255,
   note:'24ビットで約1,677万色、1秒に60コマ。目で見た景色に近い表現ができます。'},
];
const fmtB=b=>b<1024?Math.round(b).toLocaleString()+'B':b<1048576?(b/1024).toFixed(1)+'KB':(b/1048576).toFixed(2)+'MB';
const infoBytes=e=>e.w*e.h*e.bits/8;

/* ===== 音（時代が進むと音もなめらかに） ===== */
let actx=null;
function snd(f,d=.08,v=.05,slide=0){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
  const e=ERAS[stage]||ERAS[0],c=actx,o=c.createOscillator(),g=c.createGain();
  o.type=e.bits<=2?'square':e.bits<=8?'triangle':'sine';o.frequency.setValueAtTime(f,c.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,c.currentTime+d);
  g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+.02)}catch(e){}}
const tune=(ns,step=90)=>ns.forEach((f,i)=>setTimeout(()=>snd(f,.12,.05),i*step));

/* ===== 乱数とステージ作り ===== */
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
let stage=0,map,cols,enemies,coins,goalX,parts=[],plats=[],gates=[],ufo=null,secret=false,secretN=0,gateMsg=null;
function build(si){
  const E=ERAS[si],R=rng(1234+si*777);cols=E.len;const rows=VH/T;
  map=Array.from({length:rows},()=>new Uint8Array(cols));
  enemies=[];coins=[];plats=[];gates=[];
  const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
  let x=0,gh=7;
  const ground=(x0,x1,top)=>{for(let c=x0;c<x1&&c<cols;c++)for(let r=top;r<rows;r++)map[r][c]=1};
  ground(0,12,7);x=12;
  while(x<cols-14){
    if(R()<E.gapP){x+=ri(E.gap[0],E.gap[1]);}
    if(E.steps&&R()<.35)gh=R()<.5?6:7;else gh=7;
    const L=ri(Math.max(3,7-si),Math.max(5,11-si));
    ground(x,x+L,gh);
    if(L>=5&&R()<E.en){enemies.push({x:(x+ri(2,L-2))*T,y:(gh-1)*T+2,w:14,h:12,vx:-E.es*(R()<.5?1:-1),fly:false,dead:0})}
    if(R()<.55){ // 空中ブロック
      const py=gh-4,px=x+ri(0,Math.max(0,L-4)),pl=ri(2,4);
      for(let c=px;c<px+pl&&c<cols;c++)map[py][c]=R()<.3?3:2;
      plats.push({x:px*T,y:py*T,w:pl*T});
      if(R()<.6)for(let c=px;c<px+pl;c++)coins.push({x:c*T+8,y:(py-1)*T+8,got:false});
    }else if(R()<.5){for(let c=x+1;c<x+Math.min(L,4);c++)coins.push({x:c*T+8,y:(gh-2)*T+8,got:false})}
    x+=L;
  }
  ground(x,cols,7);goalX=(cols-5)*T;
  for(let i=0;i<E.fly;i++){const fx=(20+Math.floor(R()*(cols-30)))*T;enemies.push({x:fx,y:40+R()*30,y0:40+R()*30,w:14,h:14,vx:-.4-R()*.3*si,fly:true,ph:R()*6,dead:0})}
  // ビットゲート（8個の電球スイッチ＋扉）
  for(const f of (E.gates===1?[.45]:[.34,.66])){
    const x0=Math.floor(cols*f),sw=x0+2,wall=x0+12;
    for(let c=x0-1;c<x0+16;c++)for(let r=0;r<rows;r++)map[r][c]=r>=7?1:0;
    for(let i=0;i<8;i++)map[3][sw+i]=6;
    for(let r=0;r<7;r++)map[r][wall]=5;
    const L=(x0-1)*T,Rr=(x0+16)*T;
    enemies=enemies.filter(e=>e.fly||e.x<L||e.x>Rr);coins=coins.filter(c=>c.x<L||c.x>Rr);plats=plats.filter(p=>p.x+p.w<L||p.x>Rr);
    gates.push({sw,wall,bits:new Array(8).fill(0),target:Math.max(3,1+Math.floor(Math.random()*E.gmax)),open:false});
  }
}
const tileAt=(px,py)=>{const c=Math.floor(px/T),r=Math.floor(py/T);if(c<0||c>=cols)return 0;if(r<0)return map[0][c]===5?5:0;return r>=map.length?0:map[r][c]};
const gateOf=c=>gates.find(g=>c>=g.sw&&c<g.sw+8);
const gateVal=g=>g.bits.reduce((a,b,i)=>a+b*(128>>i),0);
const bin8=v=>v.toString(2).padStart(8,'0').replace(/(.{4})/,'$1 ');

/* ===== プレイヤー ===== */
let P,cam=0,coinsN=0,lives=3,timeLeft=0,state='title',frame=0,keys={},jumpHeld=false,shake=0,spawnX=40,spawnY=80;
function resetPlayer(){P={x:spawnX,y:spawnY,w:12,h:14,vx:0,vy:0,on:false,face:1,inv:0,walk:0}}
const camFor=x=>Math.max(0,Math.min(x-VW*.4,cols*T-VW));
function hurt(){if(P.inv>0)return;lives--;snd(220,.4,.06,.3);shake=12;
  if(lives<=0){state='over';keys={};showQuiz();return}
  resetPlayer();P.inv=90;cam=camFor(spawnX);}
function hitSwitch(c){const g=gateOf(c);if(!g||g.open)return;const i=c-g.sw;g.bits[i]^=1;snd(g.bits[i]?880:440,.07,.05);
  if(gateVal(g)===g.target){g.open=true;for(let r=0;r<7;r++)map[r][g.wall]=0;
    spawnX=(g.wall+2)*T;spawnY=7*T-14;coinsN+=5;shake=6;tune([523,659,784,1047],80);
    for(let r=1;r<7;r+=2)spark(g.wall*T+8,r*T);gateMsg={t:150,g}}}

function step(){
  frame++;const E=ERAS[stage];
  if(ufo&&ufo.state==='leave'){ufo.t++;ufo.x+=3;ufo.y-=1.6;P.y=Math.min(P.y+2.5,(7*T)-P.h)}
  if(gateMsg&&gateMsg.t>0)gateMsg.t--;
  if(state!=='play')return;
  if(ufo){ufo.t++;
    if(ufo.state==='hover'){ufo.x=ufo.bx+Math.sin(ufo.t*.02)*22;ufo.y=ufo.by+Math.sin(ufo.t*.05)*3;
      if(P.x<ufo.x+12&&P.x+P.w>ufo.x-12&&P.y<ufo.y+8&&P.y+P.h>ufo.y-6){ufo.state='carry';secret=true;P.vx=P.vy=0;keys={};
        [392,523,659,784,988,1175].forEach((f,i)=>setTimeout(()=>snd(f,.15,.05,1.2),i*70));shake=6}}
    else if(ufo.state==='carry'){
      ufo.x+=5;ufo.y+=(26-ufo.y)*.05;
      P.x=ufo.x-P.w/2;P.y=ufo.y+14+Math.sin(frame*.15)*1.5;P.walk+=.2;
      if(frame%3===0)parts.push({x:ufo.x+(Math.random()-.5)*14,y:ufo.y+6,vx:0,vy:.6,g:0,t:24,c:'rgba(140,255,200,.6)',s:1.4});
      for(const c of coins)if(!c.got&&Math.abs(c.x-ufo.x)<10&&c.y<ufo.y+40){c.got=true;coinsN++;snd(1320,.06,.03,1.3)}
      cam+=(camFor(P.x)-cam)*.2;
      if(ufo.x>goalX+40){ufo.state='leave';P.vy=0;coinsN+=10;secretN++;state='clear';tune([523,659,784,1047,1319,1568],100);setTimeout(showClear,1100)}
      for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.t--}parts=parts.filter(p=>p.t>0);if(shake>0)shake--;
      if(frame%60===0&&timeLeft>0)timeLeft--;
      return}}
  if(frame%60===0){timeLeft--;if(timeLeft<=0){timeLeft=0;lives=1;hurt();if(state==='play')timeLeft=E.time}}
  const L=keys.L,Rr=keys.R,J=keys.J;
  const acc=P.on?.28:.18,max=2.2;
  if(L){P.vx-=acc;P.face=-1}else if(Rr){P.vx+=acc;P.face=1}else P.vx*=P.on?.78:.95;
  P.vx=Math.max(-max,Math.min(max,P.vx));
  if(J&&!jumpHeld&&P.on){P.vy=-6.3;P.on=false;snd(520,.12,.05,1.8);}
  if(!J&&P.vy<-2.5)P.vy=-2.5;
  jumpHeld=J;
  P.vy=Math.min(P.vy+.35,7);
  // 横
  P.x+=P.vx;
  if(P.x<cam)P.x=cam,P.vx=0;
  for(const yy of [P.y+1,P.y+P.h-1]){
    if(P.vx>0&&tileAt(P.x+P.w,yy)){P.x=Math.floor((P.x+P.w)/T)*T-P.w-.01;P.vx=0}
    if(P.vx<0&&tileAt(P.x,yy)){P.x=Math.floor(P.x/T+1)*T+.01;P.vx=0}
  }
  // 縦
  const wasOn=P.on;P.y+=P.vy;P.on=false;
  for(const xx of [P.x+1,P.x+P.w-1]){
    if(P.vy>=0&&tileAt(xx,P.y+P.h)){P.y=Math.floor((P.y+P.h)/T)*T-P.h;P.vy=0;P.on=true}
    else if(P.vy<0&&tileAt(xx,P.y)){const r=Math.floor(P.y/T);P.y=(r+1)*T;P.vy=0;
      if(r>=0){let c=Math.floor((P.x+P.w/2)/T);if(!map[r][c])c=Math.floor(xx/T);
        if(map[r][c]===3){map[r][c]=4;coinsN++;snd(990,.1,.05,1.5);coins.push({x:c*T+8,y:r*T-6,got:true,pop:20});spark(c*T+8,r*T)}
        else if(map[r][c]===6)hitSwitch(c);else snd(160,.06,.04)}
      break}
  }
  if(P.on&&!wasOn&&stage>=3)dust(P.x+P.w/2,P.y+P.h);
  if(Math.abs(P.vx)>.3&&P.on)P.walk+=Math.abs(P.vx)*.12;
  if(P.inv>0)P.inv--;
  if(P.y>VH+20){hurt();return}
  // コイン
  for(const c of coins){if(!c.got&&Math.abs(c.x-(P.x+6))<10&&Math.abs(c.y-(P.y+7))<11){c.got=true;coinsN++;snd(1320,.08,.04,1.3);spark(c.x,c.y)}if(c.pop)c.pop--}
  // 敵
  for(const e of enemies){
    if(e.dead){e.dead++;continue}
    if(Math.abs(e.x-P.x)>VW*1.5)continue;
    if(e.fly){e.ph+=.05;e.x+=e.vx;e.y=e.y0+Math.sin(e.ph)*22}
    else{e.vy=(e.vy||0)+.35;e.x+=e.vx;
      const fx=e.vx>0?e.x+e.w:e.x;
      if(tileAt(fx,e.y+e.h/2)||!tileAt(fx,e.y+e.h+4))e.vx*=-1;
      e.y+=e.vy;if(tileAt(e.x+e.w/2,e.y+e.h)){e.y=Math.floor((e.y+e.h)/T)*T-e.h;e.vy=0}}
    if(P.x<e.x+e.w&&P.x+P.w>e.x&&P.y<e.y+e.h&&P.y+P.h>e.y){
      if(P.vy>0&&P.y+P.h-e.y<9){e.dead=1;P.vy=-4.5;coinsN++;snd(330,.15,.05,.5);spark(e.x+7,e.y+6)}else hurt();
    }
  }
  // カメラ
  cam+=(Math.max(cam,camFor(P.x))-cam)*.2;
  // ゴール
  if(P.x>goalX){state='clear';tune([523,659,784,1047,1319],110);setTimeout(showClear,700)}
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.t--}parts=parts.filter(p=>p.t>0);
  if(shake>0)shake--;
}
function spark(x,y){for(let i=0;i<10;i++)parts.push({x,y,vx:(Math.random()-.5)*3,vy:-Math.random()*3,g:.15,t:30,c:'#FFE27A',s:1.6})}
function dust(x,y){for(let i=0;i<6;i++)parts.push({x,y,vx:(Math.random()-.5)*1.6,vy:-Math.random()*.8,g:.03,t:22,c:'rgba(200,190,170,.7)',s:2.2})}

/* ===== オリジナルキャラ（16×16・16色＝4ビット） ===== */

  o.textAlign='center';o.textBaseline='middle';
  if(done){o.fillStyle='#4CC38A';o.font='24px DotGothic16, monospace';o.fillText('ゲートが開いた！ ボーナス +5コイン',X+W/2,Y+34);
    o.fillStyle='#E6EDF2';o.font='22px DotGothic16, monospace';o.fillText(`${g.target} を2進数で書くと ${bin8(g.target)}`,X+W/2,Y+76);
    o.fillStyle='#8FA2B3';o.font='16px DotGothic16, monospace';o.fillText('ここからやり直せるようになりました',X+W/2,Y+108);return}
  o.fillStyle='#E6EDF2';o.font='19px DotGothic16, monospace';o.fillText(`ビットゲート：電球を頭でたたいて「${g.target}」にしよう`,X+W/2,Y+22);
  for(let i=0;i<8;i++){const bx=X+28+i*58,on=g.bits[i];
    o.fillStyle='#8FA2B3';o.font='14px DotGothic16, monospace';o.fillText(String(128>>i),bx+22,Y+50);
    o.fillStyle=on?'#F5B83A':'#2A3644';rr(o,bx,Y+62,44,40,8);o.fill();
    o.fillStyle=on?'#0B1219':'#8FA2B3';o.font='26px DotGothic16, monospace';o.fillText(on?'1':'0',bx+22,Y+83)}
  o.fillStyle=v===g.target?'#4CC38A':'#F5B83A';o.font='18px DotGothic16, monospace';o.fillText(`いまの数：${v}`,X+W/2,Y+116);
}

/* ===== 色を減らす（その時代の色数にする） ===== */
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>v/16-.5);
const PAL16=[[0,0,0],[255,255,255],[136,0,0],[120,176,255],[204,68,204],[0,204,85],[0,0,170],[238,238,119],[221,136,85],[102,68,0],[255,119,119],[51,51,51],[119,119,119],[170,255,102],[0,136,255],[187,187,187]];
const cache16=new Uint8Array(4096).fill(255);
function near16(r,g,b){const k=(r>>4)<<8|(g>>4)<<4|(b>>4);let v=cache16[k];if(v!==255)return v;let best=0,bd=1e9;
  for(let i=0;i<16;i++){const p=PAL16[i],d=(p[0]-r)**2*.3+(p[1]-g)**2*.59+(p[2]-b)**2*.11;if(d<bd){bd=d;best=i}}cache16[k]=best;return best}
const GB=[[15,56,15],[48,98,48],[139,172,15],[155,188,15]];
function quantize(era,w,h){
  const im=octx.getImageData(0,0,w,h),d=im.data;let i=0;
  for(let y=0;y<h;y++){const by=(y&3)*4;for(let x=0;x<w;x++,i+=4){const r=d[i],g=d[i+1],b=d[i+2],bt=BAYER[by+(x&3)];
    if(era===0){const v=(r*.3+g*.59+b*.11)/255+bt*.28>.5?236:20;d[i]=d[i+1]=d[i+2]=v}
    else if(era===1){let l=Math.round((r*.3+g*.59+b*.11)/255*3+bt*.5);l=l<0?0:l>3?3:l;const c=GB[l];d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2]}
    else if(era===2){const c=PAL16[near16(r,g,b)];d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2]}
    else{let R=Math.round(r*7/255+bt*.6),G=Math.round(g*7/255+bt*.6),B=Math.round(b*3/255+bt*.6);
      R=R<0?0:R>7?7:R;G=G<0?0:G>7?7:G;B=B<0?0:B>3?3:B;d[i]=R*36.43;d[i+1]=G*36.43;d[i+2]=B*85}}}
  octx.putImageData(im,0,0);
}
function render(){
  if(!map)return;
  const era=Math.min(stage,4),E=ERAS[era];ensureCache(era);
  const sx=shake?Math.round((Math.random()-.5)*shake*2):0;
  if(era===4){ // フルカラーは画面に直接描く（コピーと色の計算をしない）
    out.imageSmoothingEnabled=true;if(sx){out.setTransform(1,0,0,1,0,0);out.fillStyle='#000';out.fillRect(0,0,960,540)}drawWorld(out,4,sx)}
  else{if(off.width!==E.w){off.width=E.w;off.height=E.h}octx.imageSmoothingEnabled=false;drawWorld(octx,era,0);quantize(era,E.w,E.h);
    out.setTransform(1,0,0,1,0,0);out.imageSmoothingEnabled=false;out.fillStyle='#000';out.fillRect(0,0,960,540);out.drawImage(off,sx,0,960,540)}
  drawGateHUD();
}

/* ===== 画面の流れ ===== */
let hudS='';
function hud(){const E=ERAS[stage],s=[stage,coinsN,lives,timeLeft].join('|');if(s===hudS)return;hudS=s;
  $('#hStage').textContent=stage+1;$('#hEra').textContent=E.col+'・'+E.w+'×'+E.h;$('#hFps').textContent=E.fps;$('#hCoin').textContent=coinsN;$('#hLife').textContent=lives;$('#hTime').textContent=timeLeft}
function show(html){$('#card').innerHTML=html;$('#ov').hidden=false;const b=$('#card .big');b&&b.focus()}
function specHTML(E){return `<div class="spec"><div><small>解像度</small><b>${E.w}×${E.h}</b></div><div><small>色の数</small><b>${E.col}</b></div><div><small>1画素のビット数</small><b>${E.bits}ビット</b></div><div><small>1秒のコマ数</small><b>${E.fps}fps</b></div></div>
  <div class="calc">1画面の情報量 ＝ ${E.w}×${E.h}×${E.bits}ビット÷8 ＝ <b>${fmtB(infoBytes(E))}</b><br>1秒の動き（${E.fps}コマ）なら ＝ <b>${fmtB(infoBytes(E)*E.fps)}</b></div>`}
function charThumb(){const c=document.createElement('canvas');c.width=c.height=16;if(charR)c.getContext('2d').drawImage(charR,0,0);return c}
function showTitle(){state='title';stage=0;build(0);spawnX=40;spawnY=80;resetPlayer();render();
  show(`<div class="k">DIGITAL EVOLUTION RUN</div><h1>デジタル<span>進化</span>ラン</h1>
  <p>キャラをゴールまで連れていこう。ステージが進むと時代も進み、2色・カクカクのドット絵から、フルカラーでなめらかな映像へ変わっていきます。そのぶん、コースもどんどん難しくなります。</p>
  <p class="keys">操作：← → で移動、スペース または ↑ でジャンプ（長押しで高く）　敵は上からふむとたおせます<br>道をふさぐ「ビットゲート」は、電球を頭でたたいて2進数で数をつくると開きます</p>
  <p class="keys" style="color:var(--blue)">ときどき、空を見上げてみよう…？</p>
  <button class="big" id="go">スタート</button>
  <div class="row"><span class="charnow" id="cnow"></span><button class="sub" id="edit">キャラをつくる</button></div>
  <p class="keys">先生用：ステージを選んではじめる　${ERAS.map((E,i)=>`<button class="sub sel" data-s="${i}" style="display:inline-block;padding:2px 10px;margin:2px">${i+1}</button>`).join('')}</p>`);
  const cn=$('#cnow');cn.append(charThumb(),document.createTextNode(charR?'いまのキャラ：オリジナル':'いまのキャラ：ビットくん'));
  $('#go').onclick=()=>{lives=3;coinsN=0;secretN=0;intro(0)};$('#edit').onclick=showEditor;
  $$('.sel').forEach(b=>b.onclick=()=>{lives=3;coinsN=0;secretN=0;intro(+b.dataset.s)})}
function spawnUFO(){ufo=null;secret=false;if(Math.random()<.5)return;
  const cand=plats.filter(p=>p.x>20*T&&p.x<cols*T*.7);if(!cand.length)return;
  const p=cand[Math.floor(Math.random()*cand.length)];
  ufo={bx:p.x+p.w/2,x:p.x+p.w/2,by:Math.max(16,p.y-44),y:0,t:Math.random()*100,state:'hover'};ufo.y=ufo.by}
function intro(si){stage=si;build(si);spawnUFO();spawnX=40;spawnY=80;resetPlayer();cam=0;parts=[];gateMsg=null;state='intro';timeLeft=ERAS[si].time;hudS='';hud();render();const E=ERAS[si];
  show(`<div class="k">STAGE ${si+1} / 5</div><h2>${E.name}</h2><p>${E.note}</p>${specHTML(E)}
  ${si>0?`<p>前のステージより、1画面の情報量は <b style="color:var(--gold)">${(infoBytes(E)/infoBytes(ERAS[si-1])).toFixed(1)}倍</b> になりました。</p>`:''}
  <p class="keys">コース：${E.len}マス　ビットゲート：${E.gates}つ（最大${E.gmax}）　敵の速さ：×${E.es.toFixed(2)}${E.fly?'　空飛ぶウイルス：'+E.fly+'体':''}　制限時間：${E.time}秒</p>
  <button class="big" id="go">はじめる</button>`);
  $('#go').onclick=()=>{$('#ov').hidden=true;state='play';tune([392,523,659],80)}}
function showClear(){const E=ERAS[stage];
  if(stage===4){showEnd();return}
  const N=ERAS[stage+1];
  show(`<div class="k">STAGE ${stage+1} CLEAR</div><h2>${secret?'裏ルート発見！':'クリア！'}</h2>${secret?'<p style="color:var(--ok)">UFOにつかまって、ゴールまでワープしました。ボーナス +10コイン！ このUFOは、いつも出るとはかぎりません。</p>':''}<p>コイン ${coinsN}枚　のこり時間 ${timeLeft}秒</p>
  <p>次の時代へ：<b style="color:var(--ink)">${E.col} → ${N.col}</b>、解像度 ${E.w}×${E.h} → ${N.w}×${N.h}、なめらかさ ${E.fps} → ${N.fps}fps</p>
  <button class="big" id="go">次の時代へ</button>`);
  $('#go').onclick=()=>intro(stage+1)}
function showOver(){state='over';show(`<div class="k">GAME OVER</div><h2>ゲームオーバー</h2><p>${ERAS[stage].name}でつまずきました。このステージの最初からやり直せます。</p>
  <button class="big" id="go">もう一度</button><button class="sub" id="top">タイトルへ</button>`);
  $('#go').onclick=()=>{lives=3;intro(stage)};$('#top').onclick=showTitle}
/* 復活クイズ（はじめの答えが正解） */
const QZ=[['8ビットで表せるのは何通り？',['256通り','8通り','64通り']],['1KBは何B？',['1,024B','1,000B','8B']],['1MBは何KB？',['1,024KB','100KB','1,000,000KB']],
  ['8ビットは何バイト？',['1バイト','8バイト','2バイト']],['13を2進数（8けた）で書くと？',['0000 1101','0000 1011','0001 0011']],['1,024は2の何乗？',['10乗','8乗','24乗']],
  ['アナログ情報をデジタル情報に変えることを何という？',['デジタル化','アナログ化','フルカラー化']],['コンピュータは、どんな2つの状態の組み合わせで情報を表す？',['0と1','1と2','AとB']],
  ['音のデジタル化で、一定時間で区切ったあとに求めるのは？',['数値','色','文字']],['CDは1秒に何回区切っている？',['44,100回','8,000回','1,024回']],
  ['細かく区切るほど、情報の量はどうなる？',['大きくなる','小さくなる','変わらない']],['16進数の「F」は10進数でいくつ？',['15','16','10']],
  ['2進数4けたは、16進数何けたになる？',['1けた','2けた','4けた']],['文字を数字に対応させるルールを何という？',['文字コード','パスワード','解像度']],
  ['フルカラー（24ビット）で表せる色の数は約何色？',['約1,677万色','約256色','約1万色']],['動画で1秒間に見せる画像の数の単位は？',['fps','KB','bit']]];
let lastQ=-1;
function showQuiz(){let n;do{n=Math.floor(Math.random()*QZ.length)}while(n===lastQ);lastQ=n;const q=QZ[n];
  const opts=q[1].map((t,i)=>({t,ok:i===0})).sort(()=>Math.random()-.5);
  show(`<div class="k">LAST CHANCE</div><h2>復活クイズ</h2><p>正解すると、ライフが1つもどって、つづきから再開できます。</p>
  <div class="calc" style="font-size:19px">${q[0]}</div><div class="qz">${opts.map((o,i)=>`<button class="qopt" data-i="${i}">${o.t}</button>`).join('')}</div><p class="keys" id="qzMsg" style="min-height:1.4em"></p>`);
  $$('.qopt').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];$$('.qopt').forEach(x=>x.disabled=true);
    if(o.ok){b.classList.add('ok');$('#qzMsg').textContent='正解！ ライフが1つもどった！';tune([523,659,784,1047],80);
      setTimeout(()=>{lives=1;timeLeft=Math.max(timeLeft,40);resetPlayer();P.inv=120;cam=camFor(spawnX);keys={};$('#ov').hidden=true;state='play';hudS=''},900)}
    else{b.classList.add('ng');$$('.qopt').forEach((x,i)=>{if(opts[i].ok)x.classList.add('ok')});$('#qzMsg').textContent=`ざんねん！ 正解は「${q[1][0]}」`;snd(200,.3,.05,.6);setTimeout(showOver,1800)}})}
function showEnd(){const sec=secret;
  const rows=ERAS.map((E,i)=>`<tr><td>${i+1}</td><td>${E.col}</td><td>${E.bits}</td><td>${E.w}×${E.h}</td><td>${E.fps}</td><td class="n">${fmtB(infoBytes(E))}</td></tr>`).join('');
  show(`<div class="k">ALL CLEAR</div><h2>全ステージクリア！</h2><p>コイン ${coinsN}枚。ゲームの絵は、色の数（ビット数）と画素の数、1秒のコマ数がふえるほどリアルでなめらかになり、そのぶん情報量も大きくなります。</p>
  <div class="tbl"><table><tr><th>ステージ</th><th>色の数</th><th>ビット</th><th>解像度</th><th>fps</th><th>1画面の情報量</th></tr>${rows}</table></div>
  ${secretN?`<p style="color:var(--ok)">見つけた裏ルート：${secretN}回${sec?'（最後のステージもUFOでクリア！）':''}</p>`:'<p class="keys">うわさでは、空のどこかに裏ルートがあるらしい…。</p>'}
  <p>1秒の動きでくらべると、ステージ5はステージ1の約${Math.round(infoBytes(ERAS[4])*60/(infoBytes(ERAS[0])*10)).toLocaleString()}倍の情報量です。</p>
  <button class="big" id="go">もう一度あそぶ</button>`);$('#go').onclick=showTitle}

/* ===== キャラエディタ ===== */
function showEditor(){state='edit';
  const G=CH?Uint8Array.from(CH):new Uint8Array(256);let col=1,paint=false;
  show(`<div class="k">CHARACTER EDITOR</div><h2>キャラをつくろう</h2>
  <p>16×16マスのドット絵です。1マスが1画素。色は透明をふくめて16色なので、1マスを4ビットで表します。</p>
  <div class="ed"><canvas id="edc" width="320" height="320" aria-label="ドット絵のマス"></canvas>
    <div class="pal" id="pal">${CPAL.map((c,i)=>`<button data-i="${i}" ${i?`style="background:${c}"`:'class="clear"'} aria-label="${CNAME[i]}"></button>`).join('')}<div class="palinfo" id="pinfo"></div></div></div>
  <div class="calc">このキャラの情報量 ＝ 16×16×4ビット÷8 ＝ <b>128B</b>　（色をぬったマス：<span id="used">0</span>）</div>
  <div class="row"><button class="sub" id="edSample">見本を読みこむ</button><button class="sub" id="edClear">全部消す</button><button class="sub" id="edReset">ビットくんにもどす</button></div>
  <button class="big" id="edSave">このキャラであそぶ</button>
  <p class="keys">ステージ1では2色、ステージ2では4色にへってしまいます。どう見えるかためしてみよう。</p>`);
  const cv2=$('#edc'),x=cv2.getContext('2d');
  function draw(){x.fillStyle='#fff';x.fillRect(0,0,320,320);
    for(let i=0;i<256;i++){const cx=(i%16)*20,cy=(i>>4)*20;
      if(G[i]){x.fillStyle=CPAL[G[i]];x.fillRect(cx,cy,20,20)}else if(((i%16)+(i>>4))%2){x.fillStyle='#E9EDF1';x.fillRect(cx,cy,20,20)}}
    x.strokeStyle='rgba(0,0,0,.12)';x.lineWidth=1;x.beginPath();for(let k=1;k<16;k++){x.moveTo(k*20+.5,0);x.lineTo(k*20+.5,320);x.moveTo(0,k*20+.5);x.lineTo(320,k*20+.5)}x.stroke();
    $('#used').textContent=G.reduce((a,v)=>a+(v?1:0),0)}
  function pick(i){col=i;$$('#pal button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
    $('#pinfo').innerHTML=`選んだ色：${CNAME[i]}<br>番号 ${i} ＝ 2進数 <b>${i.toString(2).padStart(4,'0')}</b>`}
  function at(e){const r=cv2.getBoundingClientRect(),cx=Math.floor((e.clientX-r.left)/r.width*16),cy=Math.floor((e.clientY-r.top)/r.height*16);
    if(cx<0||cy<0||cx>15||cy>15)return;const i=cy*16+cx;if(G[i]!==col){G[i]=col;draw()}}
  cv2.onpointerdown=e=>{paint=true;cv2.setPointerCapture(e.pointerId);at(e)};cv2.onpointermove=e=>{if(paint)at(e)};
  cv2.onpointerup=cv2.onpointercancel=()=>paint=false;
  $$('#pal button').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  $('#edSample').onclick=()=>{SAMPLE.join('').split('').forEach((h,i)=>G[i]=parseInt(h,16));draw()};
  $('#edClear').onclick=()=>{G.fill(0);draw()};
  $('#edReset').onclick=()=>{CH=null;try{localStorage.removeItem('drun-char')}catch(e){}makeChar();showTitle()};
  $('#edSave').onclick=()=>{CH=G.some(v=>v)?G:null;try{CH?localStorage.setItem('drun-char',Array.from(CH,v=>v.toString(16)).join('')):localStorage.removeItem('drun-char')}catch(e){}
    makeChar();tune([523,659,784],80);showTitle()};
  pick(7);draw()}

/* ===== 入力 ===== */
const KM={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowUp:'J',KeyW:'J',Space:'J'};
addEventListener('keydown',e=>{const k=KM[e.code];if(k&&state==='play'){keys[k]=true;e.preventDefault()}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=false});
$$('#touch button').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{keys[k]=true;b.setPointerCapture(e.pointerId);e.preventDefault()});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,()=>keys[k]=false))});
addEventListener('blur',()=>keys={});
$('#back').onclick=e=>{e.preventDefault();history.length>1?history.back():location.href='index.html'};

/* ===== ループ（動きの計算は1秒60回、絵はその時代のfpsだけ描く） ===== */
let last=performance.now(),acc=0,lastR=-99;
function loop(t){acc+=Math.min(100,t-last);last=t;let n=0;
  while(acc>=1000/60&&n<4){step();acc-=1000/60;n++}if(n>=4)acc=0;
  if((state==='play'||state==='clear')&&frame-lastR>=60/ERAS[stage].fps){lastR=frame;render()}
  hud();requestAnimationFrame(loop)}

/* ===== パスワード ===== */
const PW='みんなごうかく';
const norm=v=>v.normalize('NFKC').replace(/\s/g,'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
let passOK=false;
try{localStorage.removeItem('drun-pass')}catch(e){}
function showLock(){state='lock';stage=0;build(0);resetPlayer();render();
  show(`<div class="k">LOCKED</div><h2>パスワードを入れてね</h2>
  <p>デジタル化ラボの「暗号解読」で、最終問題の答えがパスワードです。0と1から言葉をとりだそう。</p>
  <input id="pw" type="text" autocomplete="off" placeholder="ひらがなで入力" aria-label="パスワード" style="font:inherit;font-size:22px;text-align:center;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--ink);width:100%;max-width:360px;justify-self:center">
  <button class="big" id="go">ロックを解除</button><p class="keys" id="pwMsg" style="min-height:1.4em"></p>`);
  const inp=$('#pw');inp.focus();
  const tryIt=()=>{if(norm(inp.value)===PW){passOK=true;tune([523,659,784,1047],90);showTitle()}
    else{$('#pwMsg').textContent='パスワードがちがいます。暗号解読の最終問題をもう一度見てみよう。';$('#pwMsg').style.color='var(--pink)';snd(200,.25,.05,.6)}};
  $('#go').onclick=tryIt;inp.onkeydown=e=>{if(e.key==='Enter')tryIt()}}
passOK?showTitle():showLock();requestAnimationFrame(loop);
})();
</script>
